[package]
name = "translator2k"
version = "2.1.1"
description = "Translator2k — Công cụ OCR, dịch màn hình, overlay tại chỗ, live đa vùng và dịch audio realtime trên Windows"
authors = ["hieuduongzx"]
edition = "2021"

[lib]
name = "translator2k_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Translator2k"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
urlencoding = "2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case"] }
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
cosmic-text = "0.13"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-native", "directml"] }
ndarray = "0.17"
dirs = "6"
lru = "0.12"
parking_lot = "0.12"
once_cell = "1"
base64 = "0.22"
blake3 = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
semver = "1"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
strsim = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", default-features = false, features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
