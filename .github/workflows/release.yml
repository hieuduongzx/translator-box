name: Release

# Đẩy tag dạng v1.0.0 → build installer và tạo GitHub Release đính kèm file .exe.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-app/requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: pwsh -NoProfile -File packaging/build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslatorBox-Windows-x64
          path: dist/TranslatorBox-Windows-x64-*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TranslatorBox-Windows-x64-*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
