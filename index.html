<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translator2k</title>
    <script>
      (function () {
        try {
          var saved =
            localStorage.getItem("translator2k.theme") ||
            localStorage.getItem("translator2k_theme");
          var mode = saved === "light" || saved === "dark" ? saved : "system";
          var effective =
            mode === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          var root = document.documentElement;
          root.setAttribute("data-theme", effective);
          root.style.colorScheme = effective;
          root.style.backgroundColor = effective === "dark" ? "#111318" : "#f5f6f8";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
